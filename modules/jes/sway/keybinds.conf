# JES keybinds — included via sway/variant.conf when nixtop.shell == "jes"
# Base sway/keybinds.conf stays; this file unbinds conflicts then adds JES binds.
# Upstream used Mod4; we follow the repo's $mod (see sway/variables.conf).

# $mod+d is fuzzel in the base config — JES owns the launcher instead
unbindsym $mod+d
set $jes jes-cli
bindsym $mod+d exec $jes toggleLaunch

# JES surfaces
bindsym $mod+p exec $jes togglePower
bindsym $mod+Alt+f exec $jes toggleJwindow
bindsym $mod+w exec $jes reload-daemon
bindsym $mod+Shift+w exec $jes toggleWallPicker
bindsym $mod+c exec $jes toggleCal

# JES media (player widget + brightness proxy)
bindsym Alt+F12 exec $jes togglePlayer
bindsym Alt+F9 exec pamixer -t
bindsym Alt+F10 exec pamixer -d 5
bindsym Alt+F11 exec pamixer -i 5

# JES screenshots (screenpicker overlay + fullscreen fallback)
bindsym Print exec $jes screenpicker
bindsym Shift+Print exec sh -c "grim - | tee ~/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_fullscreen.png | wl-copy"
