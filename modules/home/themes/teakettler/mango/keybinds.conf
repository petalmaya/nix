
# Terminal / launcher
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,qs ipc call launcher toggle
bind=SUPER+SHIFT,d,spawn,qs ipc call notch toggle
bind=SUPER+SHIFT,s,spawn,qs ipc call notch workspaces
bind=SUPER+SHIFT,x,spawn,qs ipc call notch media


# Screenshot
bind=SUPER,Print,spawn,sh -c 'grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png'
bind=SUPER,p,spawn,qs ipc call notifications,clear

# Lock via the quickshell lockscreen
bind=SUPER,l,spawn,qs ipc call lockscreen lock

# Apps
bind=SUPER,w,spawn,firefox-esr
bind=SUPER,e,spawn,nautilus
bind=SUPER,a,spawn,foot -e yazi
bind=SUPER,n,spawn,mpv --player-operation-mode=pseudo-gui

# Audio / brightness
bind=none,XF86AudioRaiseVolume,spawn,pactl,set-sink-volume,@DEFAULT_SINK@,+5%
bind=none,XF86AudioLowerVolume,spawn,pactl,set-sink-volume,@DEFAULT_SINK@,-5%
bind=none,XF86AudioMute,spawn,pactl,set-sink-mute,@DEFAULT_SINK@,toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl,set,+5%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl,set,5%-

# Window management
bind=SUPER,c,killclient
bind=ALT,F4,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,space,togglefloating

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,KP_Left,focusdir,left
bind=SUPER,KP_Right,focusdir,right
bind=SUPER,KP_Up,focusdir,up
bind=SUPER,KP_Down,focusdir,down

# Move
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,KP_Left,exchange_client,left
bind=SUPER+SHIFT,KP_Right,exchange_client,right
bind=SUPER+SHIFT,KP_Up,exchange_client,up
bind=SUPER+SHIFT,KP_Down,exchange_client,down

# Tile
bind=SUPER,h,scroller_stack,left
bind=SUPER,v,scroller_stack,right

# Workspaces (tags)
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL,KP_Right,viewtoright,0
bind=SUPER+CTRL,KP_Left,viewtoleft,0
bind=SUPER+CTRL+SHIFT,KP_Right,tagtoright,0
bind=SUPER+CTRL+SHIFT,KP_Left,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0

# Column sizing
bind=SUPER,r,switch_proportion_preset,
bind=ALT,e,set_proportion,1.0

# Quit / reload / overview
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,c,reload_config

bind=SUPER,s,toggleoverview
# Alt-Tab-style window switcher
bind=ALT,Tab,toggleoverview
bind=SUPER,Tab,togglejump

# Mouse drag move/resize
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
