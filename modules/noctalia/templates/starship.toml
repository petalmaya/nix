# Starship prompt — rendered by NOCTALIA (not matugen) from the live palette.
# Registered as [theme.templates.user.starship] in Noctalia's settings (see
# modules/noctalia/default.nix), so every Noctalia theme change re-renders
# ~/.config/starship.toml and the prompt follows Noctalia with no reload
# (starship re-reads its config per prompt).
# Syntax is Noctalia's template engine (same {{ }} expressions as the matugen
# twin); keep in sync with modules/matugen/templates/starship/starship.toml
# that serves non-Noctalia shells.

# Pinaceae Starship Config
# Generated by noctalia - do not edit manually
palette = "pinaceae"
add_newline = false
format = "┏$username$git_branch$sudo$status$cmd_duration\n┖$directory> "

[username]
show_always = true
style_user = "{{colors.on_surface.default.hex}}"
style_root = "{{colors.on_surface.default.hex}}"
format = '[\[](bold {{colors.primary.default.hex}})[$user]($style)[\]](bold {{colors.primary.default.hex}})'

[directory]
style = "{{colors.on_surface.default.hex}}"
format = '[\[](bold {{colors.primary.default.hex}})[$path]($style)[\]](bold {{colors.primary.default.hex}})'
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
style = "{{colors.on_surface.default.hex}}"
format = '[\[](bold {{colors.primary.default.hex}})[$symbol$branch]($style)[\]](bold {{colors.primary.default.hex}})'

[git_status]
disabled = true

[sudo]
disabled = false
symbol = "⚡"
style = "{{colors.on_surface.default.hex}}"
format = '[\[](bold {{colors.primary.default.hex}})[$symbol]($style)[\]](bold {{colors.primary.default.hex}})'

[status]
disabled = false
symbol = "x"
style = "{{colors.on_surface.default.hex}}"
format = '[\[](bold {{colors.primary.default.hex}})[x$common_meaning]($style)[\]](bold {{colors.primary.default.hex}})'

[character]
disabled = true

[line_break]
disabled = true

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold {{colors.primary.default.hex}}"

[palettes.pinaceae]
# Standard colors
blue      = "{{colors.secondary.default.hex}}"
red       = "{{colors.error.default.hex}}"
green     = "{{colors.primary.default.hex}}"
yellow    = "{{colors.tertiary.default.hex}}"
cyan      = "{{colors.tertiary_container.default.hex}}"
magenta   = "{{colors.primary_container.default.hex}}"
white     = "{{colors.on_surface.default.hex}}"
black     = "{{colors.surface_container_highest.default.hex}}"

# Extended palette (Catppuccin-compatible names)
rosewater = "{{colors.tertiary_fixed.default.hex}}"
flamingo  = "{{colors.error_container.default.hex}}"
pink      = "{{colors.on_primary_container.default.hex}}"
mauve     = "{{colors.primary_container.default.hex}}"
maroon    = "{{colors.error_container.default.hex}}"
peach     = "{{colors.tertiary_fixed.default.hex}}"
teal      = "{{colors.tertiary_container.default.hex}}"
sky       = "{{colors.on_tertiary_container.default.hex}}"
sapphire  = "{{colors.secondary_container.default.hex}}"
lavender  = "{{colors.on_primary_container.default.hex}}"

# Text shades
text      = "{{colors.on_surface.default.hex}}"
subtext1  = "{{colors.on_surface.default.hex}}"
subtext0  = "{{colors.outline.default.hex}}"

# Surface shades
overlay2  = "{{colors.outline.default.hex}}"
overlay1  = "{{colors.outline.default.hex}}"
overlay0  = "{{colors.surface_container_highest.default.hex}}"
surface2  = "{{colors.surface_container_highest.default.hex}}"
surface1  = "{{colors.surface_container_highest.default.hex}}"
surface0  = "{{colors.surface.default.hex}}"
base      = "{{colors.surface.default.hex}}"
mantle    = "{{colors.surface.default.hex}}"
crust     = "{{colors.surface.default.hex}}"
