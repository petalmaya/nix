# Noctalia Mango appearance – required block from https://docs.noctalia.dev/noctalia/compositor-settings/mango/
# Border
borderpx=3
no_border_when_single=0
border_radius=20

# Gap
gappih=6
gappiv=6
gappoh=12
gappov=12

# Blur – Noctalia's required values
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=1
blur_params_noise=0.02
blur_params_saturation=1.5

# Layer/shadow – Noctalia disables these for its own bar/dock
layer_animations=0
shadows=1
layer_shadows=0
shadow_only_floating=0
