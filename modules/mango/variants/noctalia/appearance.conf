# Noctalia Mango appearance – required block from https://docs.noctalia.dev/noctalia/compositor-settings/mango/
# Must use exact names: blur_layer (not blur-layer) and layer_shadows
# Border
borderpx=3
no_border_when_single=0
border_radius=20

# Gap
gappih=6
gappiv=6
gappoh=12
gappov=12

# Blur – docs: layer blur disabled, use Noctalia's own blur
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
layer_animations=0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff
