# Lucid keybinds — IPC map from upstream support/hypr/modules/binds.lua,
# translated to mango syntax. `qs ipc call -- <target> <fn>` needs the `--`
# whenever the call takes an argument (upstream note); harmless elsewhere so
# it is used everywhere. Terminal is foot, not kitty (foot-over-kitty layer);
# file manager stays nautilus; workspaces become mango tags (6, like the
# other variants — Hyprland special-workspaces have no mango equivalent).
# Lucid IPC targets: launcher, moji, settings, keyboard, workspaces, snap,
# screenshot, lock, toast (+ media/network/etc. used in-shell, not bound).

# Terminal / launcher (SUPER-tap ≈ SUPER+space on mango)
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,lucid-qs ipc call -- launcher toggle
bind=SUPER,p,spawn,lucid-qs ipc call -- launcher command
bind=SUPER,t,spawn,lucid-qs ipc call -- launcher theme
bind=SUPER,b,spawn,lucid-qs ipc call -- launcher wallpaper
bind=SUPER+SHIFT,v,spawn,lucid-qs ipc call -- launcher clipboard

# Settings / emoji / keyboard / overview
bind=SUPER,s,spawn,lucid-qs ipc call -- settings toggle
bind=SUPER,period,spawn,lucid-qs ipc call -- moji toggle
bind=SUPER,k,spawn,lucid-qs ipc call -- keyboard toggle
bind=SUPER,w,spawn,lucid-qs ipc call -- workspaces toggle

# Screenshots (shell-owned toolbar) / OCR / color picker
bind=SUPER,d,spawn,lucid-qs ipc call -- snap toggle
bind=SUPER,Print,spawn,lucid-qs ipc call -- snap toggle
bind=SUPER+SHIFT,Print,spawn,lucid-qs ipc call -- screenshot full
bind=SUPER+SHIFT,t,spawn,lucid-qs ipc call -- snap text
bind=SUPER+SHIFT,c,spawn,lucid-qs ipc call -- snap color

# Lock via the Lucid lockscreen
bind=SUPER,l,spawn,lucid-qs ipc call -- lock lock

# Apps (chromium matches current config, not upstream Zen)
bind=SUPER,e,spawn,nautilus
bind=SUPER,a,spawn,foot -e yazi

# Audio / brightness — direct controls, mirroring upstream binds.lua
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,F9,spawn,foot
bind=NONE,F10,spawn,lucid-qs ipc call -- lock lock

# Window management
bind=SUPER,c,killclient
bind=ALT,F4,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,minus,togglefloating

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Move
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Workspaces (tags)
bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0

# Column sizing / overview
bind=SUPER,r,switch_proportion_preset,
bind=ALT,e,set_proportion,1.0
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,c,reload_config
bind=SUPER,o,toggleoverview
bind=ALT,Tab,toggleoverview
bind=SUPER,Tab,togglejump

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
