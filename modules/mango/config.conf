# MangoWC entry config - out-of-store symlinked (see mango/default.nix),
# so edits here are live: change, then `mmsg dispatch reload_config`.
env=XDG_CURRENT_DESKTOP,mango
exec-once=dbus-update-activation-environment --systemd --all

# polkit agent: the only line that needs a nix store path, so it lives in
# a generated file instead - see mango/default.nix
source=~/.config/mango/polkit.conf

# Settings
source=~/.config/mango/settings.conf
# Autostart
source=~/.config/mango/autostart.conf
# Keybinds
source=~/.config/mango/keybinds.conf
# Layout
source=~/.config/mango/layout.conf
# Appearance
source=~/.config/mango/appearance.conf
# Rules
source=~/.config/mango/rules.conf
# Animations
source=~/.config/mango/animations.conf
# Dynamic Theme – generated at runtime (theme-neutral, §8.4)
source=~/.local/state/nixtop/theme/mango.conf
