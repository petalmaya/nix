# NetBSD Mango keybinds – waybar + rofi
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,w,spawn,firefox-esr
bind=SUPER,s,toggleoverview
bind=SUPER,c,killclient
bind=SUPER,f,togglemaximizescreen
# rofi on Super+Shift+D, waybar toggle via IPC if needed
bind=SUPER+SHIFT,d,spawn,rofi -show window
