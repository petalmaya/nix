# Bar — top swaybar with sway's status.sh (i3bar JSON)
# The old Ubuntu dotfile used i3status -c ~/.config/i3status/config;
# on Nix we ship ~/.config/sway/status.sh instead (no extra pkg needed).
bar {
    mode dock
    position top
    status_command ~/.config/sway/status.sh
    font pango:FiraCode Nerd Font 10
    separator_symbol "  ·  "
    colors {
        background #0b1519
        statusline #a9c2c7
        separator #31505b
        focused_workspace  #c8b98c #13262c #e7efed
        active_workspace   #31505b #13262c #e7efed
        inactive_workspace #0b1519 #0b1519 #718b91
        urgent_workspace   #a97878 #2b171b #f2d8d4
    }
}
