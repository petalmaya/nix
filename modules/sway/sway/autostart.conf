# Autostart — daemons & idle locking (mako, swayidle, polkit)
# mako is started as --no-startup-id so sway doesn't wait for it
exec_always --no-startup-id mako
exec_always --no-startup-id swayidle -w timeout 300 "$lock" timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep "$lock"
# polkit agent — wrapper lives at ~/.local/bin/start-polkit (generated by HM, works store or live)
exec ~/.local/bin/start-polkit
