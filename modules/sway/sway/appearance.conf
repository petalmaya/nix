# Appearance — borders, gaps, fonts, swayfx (matugen owns colors)
font pango:FiraCode Nerd Font 10
default_border pixel 2
default_floating_border pixel 2
gaps inner 8
gaps outer 5
# off so a lone window keeps its outer gaps instead of going flush to the walls
smart_gaps off
workspace_auto_back_and_forth yes
focus_follows_mouse no
floating_modifier $mod normal

# swayfx extras — harmless on plain sway, honoured on swayfx
corner_radius 8
smart_corner_radius on
blur enable
blur_xray disable
blur_passes 2
blur_radius 7
shadows enable
shadows_on_csd enable
shadow_blur_radius 20
shadow_color #00000055
default_dim_inactive 0.0
# NOTE: client.* colors are generated by matugen at
# ~/.local/state/nixtop/theme/sway (included from sway/config)
# Fallback mineral-blue palette is injected only if matugen hasn't run yet:
client.focused          #c8b98c #13262c #e7efed #c8b98c #c8b98c
client.focused_inactive #31505b #13262c #a9c2c7 #31505b #31505b
client.unfocused        #1c3036 #0b1519 #718b91 #1c3036 #1c3036
client.urgent            #a97878 #2b171b #f2d8d4 #a97878 #a97878
client.placeholder      #31505b #0b1519 #a9c2c7 #31505b #31505b
