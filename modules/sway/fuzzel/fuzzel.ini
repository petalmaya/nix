[main]
font=FiraCode Nerd Font:size=11
terminal=foot -e
prompt=>   
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
width=42
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay
# matugen owns colors — generated at ~/.config/fuzzel/themes/generated and
# pulled in via the include below (fuzzel applies includes inline, so color
# keys here would override the theme; keep this file behavior-only like mako).
include=~/.config/fuzzel/themes/generated

[border]
width=2
radius=8
