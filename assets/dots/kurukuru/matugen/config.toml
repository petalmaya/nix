[config]
# Matugen 4.0 Config File for Flutterice Templates

[templates.antigravity]
input_path = "templates/antigravity/antigravity.json"
output_path = "~/.gemini/config/theme.json"
post_hook = "bash ~/.config/matugen/templates/antigravity/apply.sh"

[templates.bat]
input_path = "templates/bat/bat.tmTheme"
output_path = "~/.config/bat/themes/flutterice.tmTheme"
post_hook = "bash ~/.config/matugen/templates/bat/apply.sh"

[templates.cava]
input_path = "templates/cava/cava.ini"
output_path = "~/.config/cava/themes/flutterice"
post_hook = "bash ~/.config/matugen/templates/cava/apply.sh"

[templates.emacs]
input_path = "templates/emacs/emacs.el"
output_path = "~/.config/emacs/themes/flutterice-theme.el"
post_hook = "bash ~/.config/matugen/templates/emacs/apply.sh"

[templates.foot]
input_path = "templates/foot/foot"
output_path = "~/.config/foot/themes/flutterice"
post_hook = "bash ~/.config/matugen/templates/foot/apply.sh"

[templates.fuzzel]
input_path = "templates/fuzzel/fuzzel.conf"
output_path = "~/.config/fuzzel/themes/flutterice"
post_hook = "bash ~/.config/matugen/templates/fuzzel/apply.sh"

#[templates.fuzzel]
#input_path = "./templates/fuzzel-colors.ini"
#output_path = "~/.config/fuzzel/colors.ini"

[templates.gtk3]
input_path = "templates/gtk/gtk3.css"
output_path = "~/.config/gtk-3.0/flutterice.css"
post_hook = "bash ~/.config/matugen/templates/gtk/apply.sh {{ mode }}"

[templates.gtk4]
input_path = "templates/gtk/gtk4.css"
output_path = "~/.config/gtk-4.0/flutterice.css"
post_hook = "bash ~/.config/matugen/templates/gtk/apply.sh {{ mode }}"

[templates.lazygit]
input_path = "templates/lazygit/lazygit.yml"
output_path = "~/.config/lazygit/themes/flutterice.yml"
post_hook = "bash ~/.config/matugen/templates/lazygit/apply.sh"

[templates.niri]
input_path = "templates/niri/niri.kdl"
output_path = "~/.config/niri/flutterice.kdl"
post_hook = "bash ~/.config/matugen/templates/niri/apply.sh"

[templates.papirus_icons]
input_path = "templates/papirus-icons/colors"
output_path = "templates/papirus-icons/colors-final"
post_hook = "bash ~/.config/matugen/templates/papirus-icons/apply.sh"

[templates.pywalfox]
input_path = "templates/pywalfox/pywalfox.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "bash ~/.config/matugen/templates/pywalfox/apply.sh {{ mode }}"

[templates.qt5ct]
input_path = "templates/qt/qtct.conf"
output_path = "~/.config/qt5ct/colors/flutterice.conf"

[templates.qt6ct]
input_path = "templates/qt/qtct.conf"
output_path = "~/.config/qt6ct/colors/flutterice.conf"

[templates.spicetify]
input_path = "templates/spicetify/spicetify.ini"
output_path = "~/.config/spicetify/Themes/Comfy/color.ini"
post_hook = "bash ~/.config/matugen/templates/spicetify/apply.sh"

[templates.starship]
input_path = "templates/starship/starship.toml"
output_path = "~/.config/starship.toml"

#[templates.yazi]
#input_path = "templates/yazi/yazi.toml"
#output_path = "~/.config/yazi/flavors/flutterice.yazi/flavor.toml"
