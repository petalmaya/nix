name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix flake check --no-build
      - run: nix run nixpkgs#statix -- check .
      - run: nix run nixpkgs#deadnix -- -f .
